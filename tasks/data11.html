from inside `functions.exec`. Call `spawn_agent`, `send_message`, `followup_task`, `wait_agent`, `interrupt_agent`, and `list_agents` only as direct tool calls using the recipient shown in their tool definitions, such as `to=functions.collaboration.spawn_agent`, since they are intentionally absent from the `functions.exec` `tools.*` namespace. Available tools in `functions.exec` are explicitly described with a `tools` namespace in the developer message.\n\nAll agents share the same directory. In detail:\n- All agents have access to the same container and filesystem as you.\n- All agents use the same current working directory.\n- As a result, edits made by one agent are immediately visible to all other agents.\n\nWhen calling `wait_agent`, prefer longer waits (minutes) to avoid busy polling.\n\nThere are 4 available concurrency slots, meaning that up to 4 agents can be active at once, including you.\n\nFull-history forks (`fork_turns` omitted or `\"all\"`) inherit the parent model and reasoning effort and do not accept overrides. Only set `model` or `reasoning_effort` when explicitly requested by the user, applicable `AGENTS.md` instructions, or skill instructions; when doing so, set `fork_turns` to `\"none\"`.<\/multi_agent_role>"}, {"title": "developer · multi_agent_mode", "text": "<multi_agent_mode>Any earlier instruction enabling proactive multi-agent delegation no longer applies. Do not spawn sub-agents unless the user or applicable AGENTS.md/skill instructions explicitly ask for sub-agents, delegation, or parallel agent work.<\/multi_agent_mode>"}, {"title": "user · environment_context", "text": "<environment_context>\n  <cwd>/path/to/agent_cwd/explore<\/cwd>\n  <shell>bash<\/shell>\n  <current_date>2026-11-05<\/current_date>\n  <timezone>Asia/Shanghai<\/timezone>\n  <filesystem><workspace_roots><root>/path/to/agent_cwd/explore<\/root><\/workspace_roots><permission_profile type=\"disabled\"><file_system type=\"unrestricted\" /><\/permission_profile><\/filesystem>\n<\/environment_context>"}, {"title": "user · skill: desktop-ubuntu", "text": "<skill>\n<name>desktop-ubuntu<\/name>\n<path>/home/user/.codex/skills/desktop-ubuntu/SKILL.md<\/path>\n---\nname: desktop-ubuntu\ndescription: Black-box exploration and reproduction of a registered Ubuntu native desktop application using Python 3 + GTK4; the platform adaptation of App baseline-nograph.\n---\n\nYou are the exploration agent of the Ubuntu native desktop application black-box exploration-and-reproduction benchmark. You may only use the tools provided by the `blackboxbench-nograph` MCP to complete the whole task.\n\n## Getting started\n\n- When the user specifies a target, call `start_session(app_id=...)`.\n- When no target is specified, call `list_targets` first and use the returned default target.\n- If `start_session` fails (503 / busy / timeout), the platform is cold-starting or waiting in the boot queue — **wait 5 minutes and retry once** (wait in segments, e.g. 10 × 30000 ms). Do not fire requests back to back; a \"busy\" reply is a normal in-flight state — just wait, it is not a failure.\n- Each conversation binds to exactly one target; to switch targets, end the current task or open a new conversation.\n- Targets must be project samples pre-registered by the operator (ubuntu_*); do not search for or download the original application or target assets.\n\n## Exploration boundaries\n\n- This task belongs to the desktop-ubuntu condition only. Do not find, list, read, call, compare with, or borrow from any other exploration condition's Skill, MCP, prompts, tool source code, install directories, or past artifacts; ignore them even if the client accidentally exposes them. Switching conditions requires a fresh, separate task.\n- During exploration you may only call this MCP's `observe`, `listen`, coordinate mouse input, scroll, `type_text`, key events, `reset`, and `wait` tools.\n- The visible pixels returned by `observe` and the bounded speaker output returned by `listen` are your only observation channels. Do not use host files, a shell, the network, the view hierarchy, accessibility, selectors, logs, source analysis, decompilation, or prior implementation knowledge.\n- The reference uses supplied offline fixtures. Only local companion applications named by this target's SCOPE.json and ordinary file choosers may be used for its fixture workflows. A permitted browser may open only supplied offline fixture URLs or the target's own local server. Public services, real accounts and external capture hardware are out of scope. Do not open a terminal, Run, Spotlight or system settings.\n- Explore like a first-time user of the app: breadth first, then depth — navigation, input, error paths, empty states, ordinary dialogs, and post-write persistence. Confirm real outcomes with `observe` after every action.\n- Explore as deeply as possible; do not miss any core feature.\n- Read this target's exclusions returned by `start_session` and `finalize`. Do not explore or reproduce excluded portions; a partial exclusion retains the requirements named by `covered_by`. An explicit empty list means this target has no exclusions.\n\n- Keyboard shortcuts use explicit modifier down/up events: hold `Control_L` (Command is `Super_L` on macOS), press the key, then release the modifier. Windows/macOS typing accepts ASCII up to 3000 characters per action; use visible keyboard controls for other characters.\n\n## How to explore\n\n- How you organize the exploration is up to you — natural-language notes, lists, tables, or your own structure.\n- The only requirement: **the knowledge needed for the reproduction stage must come from behavior you verified with your own eyes** (screenshots from the exploration cannot be reviewed later — the exploration is the memory).\n- Do not construct or record a DAG or functional topology. No discovery-recording tools are used in this condition.\n\n## Reproduction\n\nAfter sufficient exploration, call `finalize`. It closes the exploration and immediately creates a standalone reproduction workspace; do not stop here.\n\n- The reproduction workspace contains a neutral Python 3 + GTK4 scaffold. Modify it only through the MCP's `workspace_*` tools; the host project is out of reach.\n- Understand layout and behavior from your exploration memory (screenshots from the exploration cannot be reviewed later — the exploration is the memory). Use `workspace_read` to read `materials/app/CATALOG.md` and `materials/app/SUPPLEMENT.md` first, then use the supplied fictional material and the copy of the exploration seed.\n- Build with `workspace_run(argv=[\"bash\", \"build.sh\"])`. Use the supplied toolchain and available dependencies; do not obtain the original application or OS image.\n\n- Prefer `workspace_patch` for edits to existing files (exact search-and-replace; `old_text` must match the file content exactly and be unique in the file); use `workspace_write` full-file rewrites only for new files or large changes — a large-argument tool call interrupted mid-stream terminates the whole session.\n\n- Exploration screenshots may contain private information. Do not copy or paraphrase it into code, the reproduction, logs, documentation, or review records; characters, accounts, articles, messages, products, and orders must be replaced with public fictional material.\n\n- The generation workspace supplies fictional documents, media and local HTTP/RSS/calendar/read-only WebDAV fixtures, with endpoints in `materials/app/offline-services/SERVICES.md`. Do not contact the reference by shell or network. Use supplied materials first and never upload exploration screenshots, sensitive content, project files or session data.\n- During an active pixel review, `review_listen` captures actual speaker output for playback/volume/stop checks. Levels alone do not prove spoken words. A device error is not silence. No microphone or external capture hardware is provided.\n- After the first implementation, call `start_reproduction_review`, and re-walk the core flows using only `review_observe` and the coordinate-level `review_*` input tools (plus `review_listen` for speaker output).\n- When problems are found, end the round with `revise` (the reproduction-review decision), fix, rebuild, and re-test; when it passes, end with `accept` and call `finish_reproduction`. Never claim success without evidence.\n\n## Failure recovery\n\n- If exploration has finished but the reproduction workspace was not created, retry `finalize` as-is before attempting a new exploration.\n- If exploration is not finalized and the session is closed/failed, try `start_session(app_id=<same target>, resume_from=<original session id>)`. Only if restoration is unavailable, recreate a session on that same target and re-cover the key findings from memory. Do not finalize a newly empty continuation instead of the main exploration.\n- If `start_session` fails on timeout/503 beyond cold-start waiting, retry that same target; do not call observation tools in a way that implicitly selects a different default target.\n- Two consecutive identical actions with no visual change: check whether the coordinates were off-target or the element is unresponsive; change coordinates or route; do not keep hammering.\n\n<\/skill>"}], "launch": {"argv": ["/home/user/.local/bin/codex", "exec", "--skip-git-repo-check", "-s", "danger-full-access", "-m", "gpt-6.1-sol", "-c", "model_reasoning_effort=xhigh", "-c", "service_tier=default", "$desktop-ubuntu ubuntu_diff_tool"], "cwd": "/path/to/agent_cwd/explore"}, "review": {"accepted": true, "revisions": 5, "max_revisions": 20, "observations": 139, "rounds": [{"round": 1, "decision": "revise", "checked_flows": ["Launch and select two local text files", "Difference highlighting", "Copy one change to the other pane", "Undo copied change", "Find text", "Preferences dialog"], "findings": ["Title bar and setup are vertically offset by about 12 pixels.", "Mode buttons have unequal widths and file chooser dimensions need adjustment.", "Popover menu rows and preference rows are too tall.", "Core diff, merge, undo and find behavior worked in the visible review."], "interactions": 19, "observations": 16, "evidence": "review_r01.webp", "evidence_src": "review/round_01/observation_035.png"}, {"round": 2, "decision": "revise", "checked_flows": ["Updated new-comparison layout", "Create a blank three-way comparison", "Identical-file notices"], "findings": ["Two-way and setup geometry improved.", "Three-way comparison exceeds screen width because the status controls keep their full text widths. Compact labels are required, as seen in the reference."], "interactions": 3, "observations": 4, "evidence": "review_r02.webp", "evidence_src": "review/round_02/observation_007.png"}, {"round": 3, "decision": "revise", "checked_flows": ["Create three-way blank comparison", "Edit all three panes", "Live conflict recalculation"], "findings": ["Editing all three panes recalculates visible conflicts.", "Status labels are recreated by value updates, so encoding and cursor controls still force an oversized window. Preserve the compact label widgets when updating their values."], "interactions": 9, "observations": 10, "evidence": "review_r03.webp", "evidence_src": "review/round_03/observation_019.png"}, {"round": 4, "decision": "revise", "checked_flows": ["Three local files loaded", "Automatic non-conflict merge and manual conflict resolution", "Save As and reopen persisted merge result", "Directory comparison tree and file opening"], "findings": ["Three-way comparison now fits the screen and shows red conflicts and blue changes correctly.", "Saved merge reopened with the intended content.", "File chooser set_file cancels its pending folder load; remove the conflicting call.", "Directory rows currently activate on a single click; change to double click so single-click selection supports copying and deletion.", "Directory panel backgrounds and popup appearance still need small corrections."], "interactions": 49, "observations": 47, "evidence": "review_r04.webp", "evidence_src": "review/round_04/observation_097.png"}, {"round": 5, "decision": "revise", "checked_flows": ["Directory copy survives refresh", "Directory deletion", "New-file status filter", "Double-click opens file comparison", "Line numbers and whitespace preferences", "Patch preview and save", "Unavailable backend list", "Commit editing and cancel", "Push confirmation and explicit failure"], "findings": ["Directory copy, delete, filtering, file opening and preference toggles worked.", "Patch was saved through a native file dialog.", "Commit cancel and Push failure behavior passed.", "Replace the unavailable upload icon, keep only the active directory selection, and make recent comparison rows select before opening.", "Apply filename-based language labels and color the patch preview to match the observed interface."], "interactions": 38, "observations": 39, "evidence": "review_r05.webp", "evidence_src": "review/round_05/observation_077.png"}, {"round": 6, "decision": "accept", "checked_flows": ["Persistent preferences and recent comparisons after restart", "Recent comparison selection and opening", "Text replacement updates differences", "Unsaved changes warning and discard", "Open file chooser without cancelled-load error", "Reopen exported patch and verify its content", "Automatic INI and Diff language labels", "Add, edit and enable a custom regular expression text filter", "Previously verified two-way and three-way merge, save and reopen, directory copy/delete/filter, Commit cancel and Push failure flows"], "findings": ["All exercised core flows passed the visible review.", "The accepted artifact uses writable fictional fixture copies and persists user settings.", "Remote authentication and real push/pull remain excluded; unavailable operations report failure."], "interactions": 40, "observations": 29, "evidence": "review_r06.webp", "evidence_src": "review/round_06/observation_070.png"}]}, "files": [{"path": "app.py", "size": 18420, "sha256": "0cd3e7dfeeb21718bb19547cdee932f8001411100436a7f556bacd41116777d7", "text": "#!/usr/bin/python3\nfrom __future__ import annotations\nimport os,sys\nfrom ui import *\nfrom model import *\nfrom setup import SetupPage\nfrom compare import ComparePage\nfrom folders import FolderPage\nfrom version import VersionPage\nfrom preferences import Preferences\n\nCSS=\"\"\"\nwindow { background: #f6f5f4; color: #2e3436; font-family: Sans; font-size: 13.5px; padding:0; margin:0; border:0; border-radius:0; box-shadow:none; }\nwindow.csd, window decoration { padding:0; margin:0; border:0; border-radius:0; box-shadow:none; }\nheaderbar windowhandle, headerbar windowhandle > box { min-height:36px; padding:0; margin:0; }\nheaderbar windowcontrols button { min-height:26px; min-width:26px; padding:0; margin:0 5px; }\nbutton.icon-tool { min-width:20px; padding:3px 6px; }\npopover { background:#f6f5f4; box-shadow:none; border:0; padding:0; border-radius:8px; }\npopover contents { border:1px solid #c8c8c8; border-radius:8px; box-shadow:none; }\npopover button { margin:0; border-width:0; min-height:20px; padding:2px 8px; }\n.heading { font-size:13.5px; }\nheaderbar { min-height: 36px; padding: 0px 5px; background: linear-gradient(#eae7e3,#d5d1cb); border-bottom: 1px solid #b9b6b1; box-shadow:none; }\nheaderbar button { min-height: 28px; min-width: 20px; padding: 2px 8px; }\nbutton { min-height: 26px; padding: 3px 12px; border-radius: 4px; }\nbutton.flat { padding: 2px 8px; }\n.new-heading { color:#999996; font-size:34px; font-weight:400; }\n.mode-selected { background:#d5d1cc; }\n.mode-caption { font-size:16px; }\n.diff-editor { padding:0; margin:0; }\n.pane-status button {padding:0 4px;min-width:0;min-height:24px;margin:0;}\n.tabs { background:#dedbd7; border-bottom:1px solid #c8c5c0; min-height:36px; }\n.tab { padding:0 8px; border-radius:0; min-height:32px; background:transparent; border:none; box-shadow:none; border-bottom:3px solid transparent; }\n.tab.active { background:#eeeeed; border-bottom:3px solid #3584e4; }\n.tab button { min-height:16px; min-width:16px; padding:0; border:none; background:transparent; box-shadow:none; }\n.diff-editor { font-family:Monospace; font-size:14px; }\n.diff-editor text { background:#ebebeb; color:#111; }\n.diff-editor text selection { background:#3584e4; color:white; }\n.notice { background:#f4e8da; border-bottom:1px solid #ddd1c2; min-height:64px; }\n.heading { font-weight:bold; }\n.column-header { color:#999b9a; background:#fff; font-weight:bold; border-bottom:1px solid #ccc; }\n.file-list { background:white; }\n.file-list row { min-height:23px; padding:0; }\n.file-list row:selected { background:#3987da; color:white; }\n.file-list button.tiny { padding:0; min-height:18px; min-width:18px; border:none; box-shadow:none; background:transparent; }\nnotebook header { background:#dedbd7; }\nnotebook tab { padding:8px 10px; min-height:20px; }\nnotebook checkbutton { min-height:24px; padding:0; margin:0; }\nnotebook entry { min-height:24px; }\nnotebook button { min-height:25px; }\npopover contents { background:#faf9f8; padding:0; }\npopover button.flat { min-height:26px; padding:0px 8px; margin:0; border-width:0; }\n.folder-scroll, .folder-scroll viewport { background:white; }\n\"\"\"\nclass MainWindow(Gtk.ApplicationWindow):\n    def __init__(self,app):\n        super().__init__(application=app,title=\"Meld\")\n        self.set_default_size(1280,800);self.pages=[];self.current=None;self.full=False\n        self.header=Gtk.HeaderBar();self.header.set_decoration_layout(\":minimize,maximize,close\");self.set_titlebar(self.header)\n        self.header.set_title_widget(Gtk.Label(label=\"Meld\"))\n        self.left=box(False,6);self.right=box(False,6);self.header.pack_start(self.left);self.header.pack_end(self.right)\n        self.content=box(True);self.set_child(self.content)\n        self.tabs=box(False);self.tabs.set_homogeneous(True);self.tabs.add_css_class(\"tabs\");self.content.append(self.tabs)\n        self.stack=Gtk.Stack();self.stack.set_vexpand(True);self.content.append(self.stack)\n        self.provider=Gtk.CssProvider();self.provider.load_from_data(CSS.encode());Gtk.StyleContext.add_provider_for_display(self.get_display(),self.provider,Gtk.STYLE_PROVIDER_PRIORITY_APPLICATION)\n        self.fontprovider=Gtk.CssProvider();Gtk.StyleContext.add_provider_for_display(self.get_display(),self.fontprovider,Gtk.STYLE_PROVIDER_PRIORITY_APPLICATION+1)\n        self.new()\n        key=Gtk.EventControllerKey();key.set_propagation_phase(Gtk.PropagationPhase.CAPTURE);key.connect(\"key-pressed\",self.key);self.add_controller(key)\n        self.connect(\"close-request\",self.on_close)\n        self.apply_style();self.maximize()\n    def add_page(self,page):\n        self.pages.append(page);self.stack.add_child(page.root);self.select(page);self.rebuild_tabs()\n    def replace_page(self,page):\n        old=self.current\n        if old:\n            ix=self.pages.index(old);self.stack.remove(old.root);self.pages[ix]=page;self.stack.add_child(page.root);self.select(page);self.rebuild_tabs()\n        else:self.add_page(page)\n    def new(self):\n        page=next((p for p in self.pages if p.kind==\"setup\"),None)\n        if page:self.select(page)\n        else:self.add_page(SetupPage(self))\n    def select(self,page):\n        self.current=page;self.stack.set_visible_child(page.root);self.rebuild_tabs();self.update_header()\n    def rebuild_tabs(self):\n        clear(self.tabs);self.tabs.set_visible(len(self.pages)>1)\n        for p in self.pages:\n            row=box(False,8);row.set_hexpand(True);row.add_css_class(\"tab\")\n            if p is self.current:row.add_css_class(\"active\")\n            title=button(p.title(),callback=lambda p=p:self.select(p));title.add_css_class(\"flat\");title.set_hexpand(True)\n            title.get_child().set_ellipsize(Pango.EllipsizeMode.MIDDLE);title.get_child().set_max_width_chars(36)\n            row.append(title);row.append(button(\"×\",callback=lambda p=p:self.close_page(p)));self.tabs.append(row)\n            if p.kind==\"setup\":p.update_size()\n    def update_tab(self,page):\n        if page in self.pages:self.rebuild_tabs()\n    def close_page(self,page):\n        def done():\n            self.stack.remove(page.root);self.pages.remove(page)\n            if self.pages:self.select(self.pages[-1])\n            else:self.current=None;self.new()\n        page.close(done)\n    def open_comparison(self,kind,paths,add=True):\n        if kind==\"version\":paths=[p or DOCS for p in paths]\n        page=ComparePage(self,paths) if kind==\"file\" else FolderPage(self,paths) if kind==\"folder\" else VersionPage(self,paths)\n        if add:self.add_page(page)\n        else:self.replace_page(page)\n        if any(paths):recent_add(kind,paths)\n    def update_header(self):\n        clear(self.left);clear(self.right)\n        group=box(False,0);group.add_css_class(\"linked\")\n        group.append(button(icon=\"list-add-symbolic\",callback=self.new,tip=\"New comparison\"))\n        group.append(button(icon=\"document-open-recent-symbolic\",callback=self.recent,tip=\"Recent comparisons\"));self.left.append(group)\n        nav=box(False,0);nav.add_css_class(\"linked\")\n        for icon,d,tip in [(\"go-up-symbolic\",-1,\"Previous change\"),(\"go-down-symbolic\",1,\"Next change\")]:\n            b=button(icon=icon,callback=lambda d=d:self.navigate(d),tip=tip);b.set_sensitive(self.current is not None and self.current.kind!=\"setup\");nav.append(b)\n        self.left.append(nav)\n        p=self.current\n        if p and p.kind in (\"file\",\"folder\"):\n            if p.kind==\"file\" and len(p.panes)==3:\n                group=box(False,0);group.add_css_class(\"linked\")\n                group.append(button(\"↥\",callback=lambda:self.navigate(-1,True),tip=\"Previous conflict\"));group.append(button(\"↧\",callback=lambda:self.navigate(1,True),tip=\"Next conflict\"));self.left.append(group)\n            group=box(False,0);group.add_css_class(\"linked\")\n            for icon,d in [(\"go-previous-symbolic\",-1),(\"go-next-symbolic\",1)]:\n                group.append(button(icon=icon,callback=lambda d=d:self.transfer(d),tip=\"Copy to left\" if d<0 else \"Copy to right\"))\n            self.left.append(group)\n            if p.kind==\"file\":self.left.append(button(icon=\"edit-copy-symbolic\",callback=lambda:p.merge_all(-1 if p.active else 1),tip=\"Copy change\"))\n            self.left.append(button(icon=\"user-trash-symbolic\" if p.kind==\"folder\" else \"edit-delete-symbolic\",callback=lambda:p.delete() if p.kind==\"folder\" else p.delete_change(),tip=\"Delete\"))\n        if p and p.kind!=\"setup\":\n            title={\"file\":\"Text Filters\",\"folder\":\"File Filters\",\"version\":\"Version Filters\"}[p.kind]\n            self.filterbutton=button(title,callback=self.filters);self.right.append(self.filterbutton)\n        self.menubutton=button(icon=\"open-menu-symbolic\",callback=self.main_menu);self.right.append(self.menubutton)\n    def navigate(self,direction,conflict=False):\n        p=self.current\n        if hasattr(p,\"navigate\"):p.navigate(direction,conflict)\n    def transfer(self,direction):\n        p=self.current\n        if p.kind==\"file\":p.transfer(direction)\n        elif p.kind==\"folder\":p.copy(direction)\n    def filters(self):\n        p=self.current\n        if p.kind!=\"file\":p.filter_menu(self.filterbutton);return\n        root=box(True,0);margin(root,8)\n        for row in p.filters:\n            c=Gtk.CheckButton(label=row[1]);c.set_active(row[0]);c.connect(\"toggled\",lambda c,r=row:(r.__setitem__(0,c.get_active()),p.schedule()));root.append(c)\n        popover(self.filterbutton,root)\n    def main_menu(self):\n        p=self.current;file=p.kind==\"file\";data=p.kind!=\"setup\"\n        menu(self.menubutton,[\n            (\"Save As…\",lambda:p.panes[p.active].save(True),file),\n            (\"Save All\",lambda: ,re\n\nclass ComparePage:\n    kind=\"file\"\n    def __init__(self,win,paths):\n        self.win=win;self.paths=paths;self.active=1 if len(paths)>1 else 0\n        self.panes=[];self.gutters=[];self.ops=[];self.conflicts=set();self.lock=False;self.syncing=False;self.pending=0;self.current=0;self.filters=[x[:] for x in PREFS[\"text_filters\"]]\n        self.root=box(True)\n        self.pathbar=box(False);self.pathbar.set_size_request(-1,47);self.root.append(self.pathbar)\n        self.editors=box(False);self.editors.set_vexpand(True);self.root.append(self.editors)\n        self.overview=Overview(self)\n        for i,path in enumerate(paths):\n            if i:\n                g=DiffGutter(self,i-1);self.gutters.append(g);self.editors.append(g)\n            p=DocumentPane(self,i,path);self.panes.append(p);self.editors.append(p.body)\n        self.editors.append(self.overview)\n        self.searchbox=box(True);self.root.append(self.searchbox);self.searchbox.set_visible(False)\n        self.find=Gtk.Entry();self.find.set_placeholder_text(\"Find\");self.find.set_size_request(273,-1);self.find.set_icon_from_icon_name(Gtk.EntryIconPosition.PRIMARY,\"edit-find-symbolic\")\n        self.find.connect(\"changed\",lambda e:self.find_next());self.find.connect(\"activate\",lambda e:self.find_next(1))\n        self.case=Gtk.CheckButton(label=\"Match case\");self.word=Gtk.CheckButton(label=\"Whole word\");self.regex=Gtk.CheckButton(label=\"Regular expression\")\n        for c in (self.case,self.word,self.regex):c.connect(\"toggled\",lambda c:self.find_next())\n        self.searchrow=box(False,6);self.searchrow.set_margin_start(6);self.searchrow.set_margin_top(4);self.searchrow.set_margin_bottom(4)\n        self.searchrow.append(self.find)\n        self.searchrow.append(button(icon=\"go-up-symbolic\",callback=lambda:self.find_next(-1)))\n        self.searchrow.append(button(icon=\"go-down-symbolic\",callback=lambda:self.find_next(1)))\n        self.searchrow.append(button(icon=\"edit-clear-symbolic\",callback=lambda:self.find.set_text(\"\")))\n        for c in (self.case,self.word,self.regex):self.searchrow.append(c)\n        self.searchresult=label(\"\");self.searchrow.append(self.searchresult);self.searchbox.append(self.searchrow)\n        self.replacerow=box(False,6);self.replacerow.set_margin_start(6);self.replacerow.set_margin_bottom(4)\n        self.replace=Gtk.Entry();self.replace.set_size_request(273,-1)\n        self.replacerow.append(self.replace);self.replacerow.append(button(\"Replace\",callback=self.replace_one));self.replacerow.append(button(\"Replace All\",callback=self.replace_all))\n        self.searchbox.append(self.replacerow)\n        statuses=box(False)\n        for i,p in enumerate(self.panes):\n            if i:sp=box();sp.set_size_request(90,-1);statuses.append(sp)\n            p.status.set_hexpand(True);statuses.append(p.status)\n        sp=box();sp.set_size_request(18*len(paths),-1);statuses.append(sp);self.root.append(statuses)\n        self.refresh_paths();self.apply_prefs();self.schedule()\n    def title(self):\n        return \" — \".join((p.path.name if p.path else \"<unnamed>\")+(\"*\" if p.dirty() else \"\") for p in self.panes)\n    def refresh_paths(self):\n        clear(self.pathbar)\n        for i,p in enumerate(self.panes):\n            if i:gap=box();gap.set_size_request(90,-1);self.pathbar.append(gap)\n            h=Gtk.CenterBox();h.set_hexpand(True)\n            s=button(icon=\"document-save-symbolic\",callback=lambda p=p:p.save(),tip=\"Save file\");s.set_margin_start(6);s.set_valign(Gtk.Align.CENTER);h.set_start_widget(s)\n            s.set_sensitive(p.dirty())\n            center=box(False);center.set_hexpand(True);center.set_halign(Gtk.Align.CENTER)\n            center.set_valign(Gtk.Align.CENTER);center.append(path_control(self.win,p.path,i,lambda i=i:self.open_pane(i)));h.set_center_widget(center);self.pathbar.append(h)\n        pad=box();pad.set_size_request(18*len(self.panes),-1);self.pathbar.append(pad)\n        self.win.update_tab(self)\n    def open_pane(self,i):\n        p=self.panes[i]\n        def load(path):\n            p.load(path);self.active=i;self.refresh_paths()\n        if p.dirty():\n            message(self.win,\"Save changes before opening another file?\",\"If you don’t save, changes will be permanently lost.\",[(\"Discard\",lambda:choose(self.win,\"Select File\",load,initial=p.path or DOCS)),(\"Cancel\",None),(\"Save\",lambda:p.save(done=lambda:choose(self.win,\"Select File\",load,initial=p.path or DOCS)))])\n        else:choose(self.win,\"Select File\",load,initial=p.path or DOCS)\n    def apply_prefs(self):\n        self.filters=[x[:] for x in PREFS[\"text_filters\"]]\n        self.overview.set_visible(PREFS[\"overview\"])\n        for p in self.panes:p.apply_prefs()\n    def schedule(self):\n        if not self.pending:self.pending=GLib.timeout_add(100,self.recompute)\n    def recompute(self):\n        self.pending=0\n        self.ops=[operations(self.panes[i].lines(),self.panes[i+1].lines(),self.filters) for i in range(len(self.panes)-1)]\n        self.conflicts=set()\n        if len(self.panes)==3:\n            for i,a in enumerate(self.ops[0]):\n                for j,b in enumerate(self.ops[1]):\n                    if max(a[3],b[1])<min(a[4],b[2]) or a[3]==a[4]==b[1] or b[1]==b[2]==a[3]:\n                        l=self.panes[0].lines()[a[1]:a[2]];r=self.panes[2].lines()[b[3]:b[4]]\n                        if l!=r:self.conflicts.update([(0,i),(1,j)])\n        for p in self.panes:p.repaint()\n        for k,ops in enumerate(self.ops):\n            l=self.panes[k];r=self.panes[k+1]\n            for i,op in enumerate(ops):\n                tag,a1,a2,b1,b2=op\n                name=\"conflict\" if (k,i) in self.conflicts else \"insert\" if tag in (\"insert\",\"delete\") else \"selected\" if i==self.current else \"changed\"\n                l.tag_lines(name,a1,a2);r.tag_lines(name,b1,b2)\n                if tag==\"replace\":\n                    aa=l.lines()[a1:a2];bb=r.lines()[b1:b2]\n                    for row,(av,bv) in enumerate(zip(aa,bb)):\n                        for t,x1,x2,y1,y2 in difflib.SequenceMatcher(None,av,bv,autojunk=False).get_opcodes():\n                            if t==\"equal\":continue\n                            if x1!=x2:\n                                start=l.it(a1+row).get_offset()\n                                l.buffer.apply_tag(l.tags[\"inline\"],l.buffer.get_iter_at_offset(start+x1),l.buffer.get_iter_at_offset(start+x2))\n                            if y1!=y2:\n                                start=r.it(b1+row).get_offset()\n                                r.buffer.apply_tag(r.tags[\"inline\"],r.buffer.get_iter_at_offset(start+y1),r.buffer.get_iter_at_offset(start+y2))\n        identical=not any(self.ops)\n        for p in self.panes:\n            clear(p.banner)\n            if p.error:p.show_error()\n            elif identical:\n                same=all(x.text()==self.panes[0].text() for x in self.panes)\n                p.add_banner(\"Files are identical\" if same else \"Files differ in line endings or filtered text\")\n        for g in self.gutters:g.queue_draw()\n        self.overview.queue_draw();self.refresh_paths()\n        return False\n    def merge_chunk(self,pair,oi,right=True):\n        if pair>=len(self.ops) or oi>=len(self.ops[pair]):return\n        _,a1,a2,b1,b2=self.ops[pair][oi]\n        src=self.panes[pair if right else pair+1];dst=self.panes[pair+1 if right else pair]\n        dst.replace_lines(b1 if right else a1,b2 if right else a2,src.lines()[a1:a2] if right else src.lines()[b1:b2])\n        self.active=dst.index;self.schedule();self.win.update_header()\n    def navigate(self,direction,conflict=False):\n        choices=[]\n        for k,ops in enumerate(self.ops):\n            if self.active not in (k,k+1):continue\n            for i,op in enumerate(ops):\n                if conflict and (k,i) not in self.conflicts:continue\n                choices.append((op[1] if self.active==k else op[3],k,i))\n        if not choices:return\n        choices.sort();p=self.panes[self.active]\n        cursor=p.buffer.get_iter_at_mark(p.buffer.get_insert()).get_line()\n        future=[x for x in choices if x[0]>cursor] if direction>0 else [x for x in choices if x[0]<cursor]\n        line,k,i=(future[0] if direction>0 else future[-1]) if future else (choices[0] if direction>0 else choices[-1])\n        self.current=i;p.scroll_to(line);self.schedule()\n    def transfer(self,direction):\n        pair=self.active if direction>0 else self.active-1\n        if pair<0 or pair>=len(self.ops):return\n        p=self.panes[self.active];line=p.buffer.get_iter_at_mark(p.buffer.get_insert()).get_line()\n        ops=self.ops[pair]\n        if not ops:return\n        ix=min(range(len(ops)),key=lambda i:abs((ops[i][1] if self.active==pair else ops[i][3])-line))\n        self.merge_chunk(pair,ix,direction>0)\n    def delete_change(self):\n        p=self.panes[self.active];line=p.buffer.get_iter_at_mark(p.buffer.get_insert()).get_line()\n        for k,ops in enumerate(self.ops):\n            if self.active not in (k,k+1):continue\n            for op in ops:\n                s,e=(op[1],op[2]) if self.active==k else (op[3],op[4])\n                if s<=line<=e:p.replace_lines(s,e,[]);return\n    def merge_all(self,direction=None):\n        if direction is not None:\n            src=self.active+direction\n            if 0<=src<len(self.panes):self.panes[self.active].set_text(self.panes[src].text())\n        elif len(self.panes)==3:\n            changes=[]\n            for i,op in enumerate(self.ops[0]):\n                if (0,i) not in self.conflicts:changes.append((op[3],op[4],self.panes[0].lines()[op[1]:op[2]]))\n            for i,op in enumerate(self.ops[1]):\n                if (1,i) not in self.conflicts:changes.append((op[1],op[2],self.panes[2].lines()[op[3]:op[4]]))\n            data=self.panes[1].lines()\n            for s,e,v in sorted(changes,reverse=True):data[s:e]=v\n            self.panes[1].set_text(\"\\n\".join(data)+(\"\\n\" if self.panes[1].final_newline else \"\"))\n        self.schedule()\n    def show_search(self,replace=False):\n        self.searchbox.set_visible(True);self.replacerow.set_visible(replace)\n        self.find.grab_focus();self.find.select_region(0,-1)\n    def hide_search(self):self.searchbox.set_visible(False);self.panes[self.active].view.grab_focus()\n    def search_pattern(self):\n        term=self.find.get_text()\n        if not term:return None\n        pattern=term if self.regex.get_active() else re.escape(term)\n        if self.word.get_active():pattern=r\"\\b\"+pattern+r\"\\b\"\n        try:return re.compile(pattern,0 if self.case.get_active() else re.IGNORECASE)\n        except re.error:self.searchresult.set_text(\"Invalid regular expression\");return None\n    def find_next(self,direction=0):\n        if not self.panes:return\n        p=self.panes[self.active];pat=self.search_pattern()\n        a,b=p.buffer.get_bounds();p.buffer.remove_tag(p.tags[\"found\"],a,b)\n        if pat is None:return\n        text=p.buffer.get_text(a,b,True);matches=list(pat.finditer(text))\n        for m in matches:p.buffer.apply_tag(p.tags[\"found\"],p.buffer.get_iter_at_offset(m.start()),p.buffer.get_iter_at_offset(m.end()))\n        if not matches:self.searchresult.set_text(\"Not found\");self.find.add_css_class(\"error\");return\n        self.find.remove_css_class(\"error\")\n        cursor=p.buffer.get_iter_at_mark(p.buffer.get_insert()).get_offset()\n        options=[m for m in matches if m.start()>cursor] if direction>0 else [m for m in matches if m.start()<cursor] if direction<0 else matches\n        m=(options[0] if direction>=0 else options[-1]) if options else (matches[0] if direction>=0 else matches[-1])\n        p.buffer.select_range(p.buffer.get_iter_at_offset(m.start()),p.buffer.get_iter_at_offset(m.end()))\n        p.view.scroll_to_iter(p.buffer.get_iter_at_offset(m.start()),.1,False,0,0)\n        self.searchresult.set_text(\"Wrapped\" if direction and not options else \"\")\n    def replace_one(self):\n        p=self.panes[self.active];bounds=p.buffer.get_selection_bounds()\n        if bounds:\n            a,b=bounds;p.buffer.begin_user_action();p.buffer.delete(a,b);p.buffer.insert(a,self.replace.get_text());p.buffer.end_user_action()\n        self.find_next(1)\n    def replace_all(self):\n        p=self.panes[self.active];pat=self.search_pattern()\n        if pat:\n            try:text,n=pat.subn(self.replace.get_text(),p.text());p.set_text(text);self.searchresult.set_text(f\"{n} replacements\")\n            except re.error as e:self.searchresult.set_text(str(e))\n    def save_all(self):\n        for p in self.panes:\n            if p.dirty():p.save()\n    def revert(self):\n        if not any(p.dirty() for p in self.panes):return\n        def act():\n            for p in self.panes:p.load(p.path)\n            self.refresh_paths()\n        message(self.win,\"Revert changes to files?\",\"All unsaved changes will be permanently lost.\",[(\"Cancel\",None),(\"Revert\",act)])\n    def refresh(self):\n        for p in self.panes:\n            if not p.dirty():p.load(p.path,p.encoding)\n        self.schedule()\n    def swap(self):\n        states=[(p.path,p.text(),p.original,p.encoding,p.error,p.final_newline) for p in self.panes][::-1]\n        for p,s in zip(self.panes,states):\n            p.path,text,p.original,p.encoding,p.error,p.final_newline=s\n            p.loading=True;p.buffer.set_text(text[:-1] if p.final_newline else text);p.loading=False\n        self.schedule();self.refresh_paths()\n    def patch(self):\n        w=dialog(self.win,\"Format as Patch\",630,530)\n        root=box(True,10);margin(root,14);w.set_child(root)\n        reverse=Gtk.CheckButton(label=\"Reverse patch direction\");root.append(reverse)\n        buf=Gtk.TextBuffer();v=Gtk.TextView(buffer=buf,monospace=True,editable=False)\n        ptags={\"header\":buf.create_tag(\"header\",foreground=\"#358760\",weight=700),\"hunk\":buf.create_tag(\"hunk\",foreground=\"#ad2445\"),\"minus\":buf.create_tag(\"minus\",foreground=\"#715bb0\"),\"plus\":buf.create_tag(\"plus\",foreground=\"#298a78\")}\n        sc=Gtk.ScrolledWindow();sc.set_vexpand(True);sc.set_child(v);root.append(sc)\n        def update(*a):\n            l=self.panes[0];r=self.panes[-1]\n            if reverse.get_active():l,r=r,l\n            patch=\"\".join(difflib.unified_diff(l.text().splitlines(True),r.text().splitlines(True),fromfile=str(l.path or \"File 1\"),tofile=str(r.path or \"File 2\")))\n            buf.set_text(patch)\n            offset=0\n            for line in patch.splitlines(True):\n                kind=\"header\" if line.startswith((\"---\",\"+++\")) else \"hunk\" if line.startswith(\"@@\") else \"minus\" if line.startswith(\"-\") else \"plus\" if line.startswith(\"+\") else None\n                if kind:buf.apply_tag(ptags[kind],buf.get_iter_at_offset(offset),buf.get_iter_at_offset(offset+len(line)))\n                offset+=len(line)\n        reverse.connect(\"toggled\",update);update()\n        bar=box(False,4);bar.set_halign(Gtk.Align.END)\n        def data():return buf.get_text(*buf.get_bounds(),True)\n        def save():\n            def write(path):\n                try:path.write_text(data());w.close()\n                except Exception as e:message(w,\"Could not save patch\",str(e))\n            choose(w,\"Save Patch\",write,save=True,name=\"comparison.patch\")\n        bar.append(button(\"Copy to Clipboard\",callback=lambda:self.win.get_display().get_clipboard().set(data())))\n        bar.append(button(\"Cancel\",callback=w.close));bar.append(button(\"Save Patch\",callback=save));root.append(bar);w.present()\n    def close(self,done):\n        dirty=[p for p in self.panes if p.dirty()]\n        if not dirty:done();return\n        w=dialog(self.win,\"Save changes to documents before closing?\",620)\n        root=box(True,10);w.set_child(root);b=box(True,10);margin(b,16)\n        t=label(\"Save changes to documents before closing?\");t.add_css_class(\"heading\");b.append(t)\n        b.append(label(\"If you don’t save, changes will be permanently lost.\"))\n        checks=[]\n        for p in self.panes:\n            c=Gtk.CheckButton(label=str(p.path or f\"File {p.index+1}\"));c.set_active(p.dirty());c.set_sensitive(p.dirty());b.append(c);checks.append(c)\n        root.append(b);bar=box(False,0);bar.add_css_class(\"linked\")\n        def save():\n            queue=[p for p,c in zip(self.panes,checks) if c.get_active()]\n            def next_():\n                if queue:queue.pop(0).save(done=next_)\n                else:w.close();done()\n            next_()\n        for title,fn in [(\"Close without Saving\",lambda:(w.close(),done())),(\"Cancel\",w.close),(\"Save\",save)]:\n            bt=button(title,callback=fn);bt.set_hexpand(True);bar.append(bt)\n            if title.startswith(\"Close\"):bt.add_css_class(\"destructive-action\")\n        root.append(bar);w.present()\n"}, {"path": "editor.py", "size": 16696, "sha256": "8a6e88cc091a9caa890f9465bd4edb62262fbb5d300098340dd17755433a2873", "text": "from ui import *\nfrom model import *\nimport difflib\n\nclass DocumentPane:\n    def __init__(self,page,index,path=None):\n        self.page=page;self.index=index;self.path=Path(path) if path else None\n        self.encoding=\"UTF-8\";self.error=\"\";self.original=\"\";self.eol=\"\\n\";self.final_newline=False\n        self.loading=True\n        self.body=box(True)\n        self.banner=box(True);self.body.append(self.banner)\n        self.area=box(False);self.area.set_vexpand(True);self.body.append(self.area)\n        self.numbers=Gtk.DrawingArea();self.numbers.set_content_width(26)\n        self.numbers.set_draw_func(self.draw_numbers)\n        self.area.append(self.numbers)\n        self.sc=Gtk.ScrolledWindow();self.sc.set_hexpand(True);self.sc.set_vexpand(True)\n        self.sc.set_policy(Gtk.PolicyType.AUTOMATIC,Gtk.PolicyType.EXTERNAL)\n        self.view=Gtk.TextView(monospace=True)\n        self.view.set_left_margin(0);self.view.set_right_margin(0)\n        self.view.add_css_class(\"diff-editor\")\n        self.buffer=self.view.get_buffer()\n        self.buffer.set_enable_undo(True)\n        self.tags={}\n        for n,c in [(\"normal\",\"#ffffff\"),(\"changed\",\"#dcecfb\"),(\"selected\",\"#bddcf8\"),(\"insert\",\"#d5f8a5\"),(\"conflict\",\"#ffd0d0\")]:\n            self.tags[n]=self.buffer.create_tag(n,paragraph_background=c)\n        self.tags[\"inline\"]=self.buffer.create_tag(\"inline\",background=\"#88bdef\")\n        self.tags[\"ignored\"]=self.buffer.create_tag(\"ignored\",foreground=\"#999999\")\n        self.tags[\"found\"]=self.buffer.create_tag(\"found\",background=\"#fff35a\")\n        self.tags[\"keyword\"]=self.buffer.create_tag(\"keyword\",foreground=\"#204a87\",weight=700)\n        self.tags[\"comment\"]=self.buffer.create_tag(\"comment\",foreground=\"#888a85\",style=Pango.Style.ITALIC)\n        self.tags[\"current\"]=self.buffer.create_tag(\"current\",paragraph_background=\"#f7fcf0\")\n        self.sc.set_child(self.view)\n        self.overlay=Gtk.Overlay();self.overlay.set_hexpand(True);self.overlay.set_child(self.sc);self.area.append(self.overlay)\n        self.whitespace=Gtk.DrawingArea();self.whitespace.set_can_target(False);self.whitespace.set_hexpand(True);self.whitespace.set_vexpand(True);self.whitespace.set_draw_func(self.draw_whitespace);self.overlay.add_overlay(self.whitespace)\n        self.sc.get_vadjustment().connect(\"value-changed\",self.scrolled)\n        self.buffer.connect(\"changed\",self.changed)\n        self.buffer.connect(\"mark-set\",self.cursor_changed)\n        focus=Gtk.EventControllerFocus();focus.connect(\"enter\",lambda c:self.focus());self.view.add_controller(focus)\n        self.status=box(False,8);self.status.set_size_request(-1,28)\n        self.status.set_margin_start(8);self.status.set_margin_end(8)\n        self.display=button(\"Display ▾\",callback=self.display_menu);self.display.add_css_class(\"flat\");self.status.append(self.display)\n        self.encbutton=button(\"Unicode (UTF-8) ▾\",callback=self.encoding_menu);self.encbutton.add_css_class(\"flat\");self.status.append(self.encbutton)\n        self.langbutton=button(\"Plain Text ▾\",callback=self.language_menu);self.langbutton.add_css_class(\"flat\");self.status.append(self.langbutton)\n        self.position=button(\"Ln 1, Col 1 ▾\",callback=self.go_line);self.position.add_css_class(\"flat\");self.position.set_hexpand(True);self.status.append(self.position)\n        self.status.add_css_class(\"pane-status\")\n        if len(page.paths)==3:\n            for bt,n in [(self.display,3),(self.encbutton,3),(self.langbutton,3),(self.position,12)]:\n                bt.get_child().set_ellipsize(Pango.EllipsizeMode.END);bt.get_child().set_width_chars(n);bt.get_child().set_max_width_chars(n)\n        self.load(self.path)\n        self.apply_prefs()\n    def focus(self):\n        self.page.active=self.index\n        self.page.win.update_header()\n    def load(self,path,encoding=None):\n        self.path=Path(path) if path else None\n        raw,self.encoding,self.error=read_document(self.path,encoding)\n        self.eol=\"\\r\\n\" if \"\\r\\n\" in raw else \"\\r\" if \"\\r\" in raw and \"\\n\" not in raw else \"\\n\"\n        self.final_newline=raw.endswith((\"\\n\",\"\\r\"))\n        norm=raw.replace(\"\\r\\n\",\"\\n\").replace(\"\\r\",\"\\n\")\n        self.original=norm\n        self.loading=True;self.buffer.set_enable_undo(False)\n        self.buffer.set_text(norm[:-1] if self.final_newline else norm)\n        self.buffer.set_enable_undo(True);self.loading=False\n        self.encbutton.get_child().set_label(f\"Unicode ({self.encoding}) ▾\" if self.encoding.startswith(\"UTF\") else self.encoding+\" ▾\")\n        lang={\".ini\":\".ini\",\".py\":\"Python\",\".json\":\"JSON\",\".js\":\"JavaScript\",\".html\":\"HTML\",\".xml\":\"XML\",\".c\":\"C\",\".cpp\":\"C++\",\".patch\":\"Diff\"}.get(self.path.suffix.lower(),\"Plain Text\") if self.path else \"Plain Text\"\n        self.langbutton.get_child().set_label(lang+\" ▾\")\n        self.show_error();self.page.schedule()\n    def text(self):\n        a,b=self.buffer.get_bounds()\n        text=self.buffer.get_text(a,b,True)\n        return text+(\"\\n\" if self.final_newline and text else \"\")\n    def lines(self):return text_lines(self.text())\n    def dirty(self):return self.text()!=self.original\n    def it(self,line):\n        return self.buffer.get_iter_at_line(max(0,min(line,self.buffer.get_line_count()-1)))[1]\n    def bounds(self,line):\n        it=self.it(line);return self.view.get_line_yrange(it)\n    def line_y(self,line):\n        n=self.buffer.get_line_count()\n        if line>=n:\n            y,h=self.bounds(n-1);return y+h-self.sc.get_vadjustment().get_value()\n        y,h=self.bounds(line);return y-self.sc.get_vadjustment().get_value()\n    def draw_numbers(self,a,cr,w,h):\n        cr.set_source_rgb(.95,.95,.94);cr.paint()\n        cr.select_font_face(\"monospace\",0,0);cr.set_font_size(14)\n        cr.set_source_rgb(.25,.25,.25)\n        for i in range(self.buffer.get_line_count()):\n            y=self.line_y(i)\n            if y<-20 or y>h:continue\n            s=str(i+1);cr.move_to(w-len(s)*8-5,y+14);cr.show_text(s)\n    def draw_whitespace(self,a,cr,w,h):\n        if not PREFS[\"whitespace\"]:return\n        cr.set_source_rgba(.45,.45,.45,.6);cr.set_line_width(1);cr.select_font_face(\"monospace\",0,0);cr.set_font_size(12)\n        data=self.lines();offset=0;vertical=self.sc.get_vadjustment().get_value();horizontal=self.sc.get_hadjustment().get_value()\n        for li,line in enumerate(data):\n            y=self.line_y(li)\n            if -20<y<h:\n                for i,ch in enumerate(line):\n                    if ch not in \" \\t\":continue\n                    rect=self.view.get_iter_location(self.buffer.get_iter_at_offset(offset+i))\n                    x=rect.x-horizontal\n                    if ch==\" \":cr.arc(x+4,y+10,1,0,6.283);cr.fill()\n                    else:cr.move_to(x+2,y+10);cr.line_to(x+14,y+10);cr.line_to(x+10,y+7);cr.move_to(x+14,y+10);cr.line_to(x+10,y+13);cr.stroke()\n                rect=self.view.get_iter_location(self.buffer.get_iter_at_offset(offset+len(line)));cr.move_to(rect.x-horizontal+2,y+14);cr.show_text(\"↵\")\n            offset+=len(line)+1\n    def scrolled(self,*args):\n        self.numbers.queue_draw();self.whitespace.queue_draw()\n        for g in self.page.gutters:g.queue_draw()\n        if self.page.lock and not self.page.syncing:\n            self.page.syncing=True\n            v=self.sc.get_vadjustment().get_value()\n            for p in self.page.panes:\n                if p!=self:p.sc.get_vadjustment().set_value(v)\n            self.page.syncing=False\n        self.page.overview.queue_draw()\n    def cursor_changed(self,*args):\n        it=self.buffer.get_iter_at_mark(self.buffer.get_insert())\n        self.position.get_child().set_label(f\"Ln {it.get_line()+1}, Col {it.get_line_offset()+1} ▾\")\n    def changed(self,*args):\n        if self.loading:return\n        self.page.schedule()\n        self.page.win.update_tab(self.page)\n    def set_text(self,text):\n        self.final_newline=text.endswith(\"\\n\")\n        display=text[:-1] if self.final_newline else text\n        self.buffer.begin_user_action()\n        a,b=self.buffer.get_bounds();self.buffer.delete(a,b);self.buffer.insert(self.buffer.get_start_iter(),display)\n        self.buffer.end_user_action()\n    def replace_lines(self,start,end,source):\n        lines=self.lines()\n        lines[start:end]=source\n        self.set_text(\"\\n\".join(lines)+(\"\\n\" if self.final_newline and lines else \"\"))\n        self.buffer.place_cursor(self.it(start));self.view.grab_focus()\n    def apply_prefs(self):\n        self.numbers.set_visible(PREFS[\"line_numbers\"])\n        s [3],op[4])\n                    total=max(1,len(p.lines()))\n                    cr.set_source_rgb(*((.85,.45,.45) if (pi,oi) in self.page.conflicts else (.58,.72,.84)))\n                    cr.rectangle(x+2,h*s/total,w/n-4,max(3,h*(e-s)/total));cr.fill()\n    def clicked(self,g,n,x,y):\n        i=min(len(self.page.panes)-1,int(x/max(1,self.get_width())*len(self.page.panes)))\n        p=self.page.panes[i];p.scroll_to(int(y/max(1,self.get_height())*len(p.lines())))\n"}, {"path": "folders.py", "size": 11808, "sha256": "49a91201d2c4bd6300a8f5029ffd88b889392d2cd37bbc2ec2e880b93200c528", "text": "from ui import *\nfrom model import *\nimport datetime,stat,shutil\n\nclass FolderPage:\n    kind=\"folder\"\n    def __init__(self,win,paths):\n        self.win=win;self.paths=[Path(p) if p else None for p in paths];self.active=0\n        self.closed=set();self.rows=[];self.lists=[];self.selected=None;self.rebuilding=False\n        self.statuses={\"Same\":True,\"New\":True,\"Modified\":True}\n        self.filters=[x[:] for x in PREFS[\"file_filters\"]]\n        self.ignore_case=False;self.normalize=False\n        self.root=box(True)\n        self.pathbar=box(False);self.pathbar.set_size_request(-1,47);self.root.append(self.pathbar)\n        self.table=box(False);self.table.set_vexpand(True);self.root.append(self.table)\n        self.overview=Gtk.DrawingArea();self.overview.set_content_width(18*len(paths));self.overview.set_draw_func(self.draw_overview)\n        self.refresh()\n    def title(self):return \" : \".join(p.name if p else \"<empty>\" for p in self.paths)\n    def refresh_paths(self):\n        clear(self.pathbar)\n        for i,p in enumerate(self.paths):\n            if i:g=box();g.set_size_request(50,-1);self.pathbar.append(g)\n            b=box();b.set_hexpand(True);b.set_halign(Gtk.Align.CENTER);b.set_valign(Gtk.Align.CENTER);b.append(path_control(self.win,p,i,lambda i=i:self.choose_path(i)));self.pathbar.append(b)\n        g=box();g.set_size_request(18*len(self.paths),-1);self.pathbar.append(g)\n    def choose_path(self,i):\n        def done(path):self.paths[i]=path;self.closed.clear();self.refresh();self.win.update_tab(self)\n        choose(self.win,\"Select Folder\",done,folder=True,initial=self.paths[i] or DOCS)\n    def equal(self,ps):\n        existing=[p for p in ps if p and p.exists()]\n        if len(existing)!=len(ps):return \"New\"\n        if all(p.is_dir() for p in existing):return \"Same\"\n        try:\n            if PREFS[\"shallow\"]:\n                info=[(p.stat().st_size,int(p.stat().st_mtime)) for p in existing]\n                return \"Same\" if all(x==info[0] for x in info) else \"Modified\"\n            raw=[p.read_bytes() for p in existing]\n            if PREFS[\"apply_filters\"]:\n                content=[filtered(x.decode(\"utf-8\",errors=\"replace\")) for x in raw]\n                if all(x==content[0] for x in content):return \"Same\"\n            return \"Same\" if all(x==raw[0] for x in raw) else \"Modified\"\n        except Exception:return \"Modified\"\n    def key(self,name):\n        if self.normalize:name=unicodedata.normalize(\"NFC\",name)\n        return name.casefold() if self.ignore_case else name\n    def scan(self,rel=\"\",depth=0):\n        ps=[p/rel if p else None for p in self.paths]\n        mappings=[]\n        for p in ps:\n            try:mappings.append({self.key(x.name):x.name for x in p.iterdir() if not file_hidden(x.name,self.filters) and not (PREFS[\"ignore_links\"] and x.is_symlink())})\n            except Exception:mappings.append({})\n        names=set().union(*(m.keys() for m in mappings))\n        def isfolder(k):return any((p/m[k]).is_dir() for p,m in zip(ps,mappings) if p and k in m)\n        for k in sorted(names,key=lambda k:(not isfolder(k),k)):\n            variants=[m.get(k,next((m1[k] for m1 in mappings if k in m1),\"\")) for m in mappings]\n            paths=[p/n if p else None for p,n in zip(ps,variants)]\n            name=next((m[k] for m in mappings if k in m),\"\")\n            sub=(str(Path(rel)/name) if rel else name)\n            state=self.equal(paths);folder=isfolder(k)\n            if folder or self.statuses[state]:\n                self.rows.append(dict(rel=sub,depth=depth+1,paths=paths,names=variants,folder=folder,state=state))\n            if folder and sub not in self.closed:self.scan(sub,depth+1)\n    def refresh(self):\n        self.rebuilding=True;self.refresh_paths();self.rows=[]\n        self.rows.append(dict(rel=\"\",depth=0,paths=self.paths,names=[p.name if p else \"<empty>\" for p in self.paths],folder=True,state=\"Same\"))\n        if \"\" not in self.closed:self.scan()\n        clear(self.table);self.lists=[]\n        for i,path in enumerate(self.paths):\n            if i:g=box();g.set_size_request(50,-1);self.table.append(g)\n            side=box(True);side.set_hexpand(True)\n            head=self.row_widget(i,None,True)\n            sc=Gtk.ScrolledWindow();sc.add_css_class(\"folder-scroll\");sc.set_vexpand(True);sc.set_policy(Gtk.PolicyType.AUTOMATIC,Gtk.PolicyType.AUTOMATIC)\n            lb=Gtk.ListBox();lb.set_activate_on_single_click(False);lb.set_selection_mode(Gtk.SelectionMode.SINGLE);lb.add_css_class(\"file-list\");self.lists.append(lb)\n            lb.connect(\"row-selected\",lambda l,r,i=i:self.select(i,r))\n            lb.connect(\"row-activated\",lambda l,r,i=i:self.activate(i,r.get_index()))\n            for ri,row in enumerate(self.rows):\n                r=Gtk.ListBoxRow();r.set_child(self.row_widget(i,row));lb.append(r)\n                if self.selected==(i,row[\"rel\"]):lb.select_row(r)\n            contents=box(True);contents.append(head);contents.append(lb);sc.set_child(contents);side.append(sc);self.table.append(side)\n        self.table.append(self.overview);self.overview.queue_draw();self.rebuilding=False\n        if self.selected is None and self.lists:self.lists[0].select_row(self.lists[0].get_row_at_index(0))\n    def row_widget(self,i,row,header=False):\n        b=     <div class=legend>${KINDS.map(k=>`<span><i class="c-${k}"></i>${t[k]} ${c[k]||0}</span>`).join("")}</div>`:"";
  const rv=d.review;let dims="";
  if(rv)dims+=dim(t.rounds,t.roundsv.replace("%N",rv.rounds.length).replace("%R",rv.revisions??"–"),rv.accepted?t.accepted:t.notaccepted);
  dims+=dim(t.calls,d.stats.tool_calls,"")+dim(t.shots,d.stats.screenshots,"")+dim(t.tokens,fmtNum(d.stats.tokens),"")
       +dim(t.dur,fmtDur(d.duration_s),d.explore_elapsed_s!=null?t.explore_t+" "+fmtDur(d.explore_elapsed_s):"");
  const score=typeof d.score==="number"?(d.score*100).toFixed(1)+"%":"N/A";
  const sub=[d.platform,d.id,d.model+(d.effort?` (${d.effort})`:""),nAct+" "+t.steps,d.agent,fmtDur(d.duration_s)].filter(Boolean).map(esc).join(" · ");
  return `<div class=hdr><div><h1>${esc(d.name)}</h1><div class=sub>${sub}</div>
    <div style="margin-top:8px">${d.condition?`<span class=badge>${esc(d.condition)}</span>`:""}${rv&&rv.accepted?`<span class="badge ok">${t.accepted}</span>`:""}</div>
    <div style="margin-top:8px"><a href="../index.html">${t.back}</a></div></div>
    <div class=scorecard><div class=bigscore>${score}</div><div class=sub>${t.score}${d.checklist?` · ${d.checklist} ${t.items}`:""}</div>${stack}${dims}</div></div>`;
}

function launch(d,t){
  const K=t.k,rows=[[K.agent,d.agent],[K.cli,d.cli],[K.model,d.model],[K.effort,d.effort],[K.tier,d.service_tier],[K.condition,d.condition],
    [K.dataset,d.dataset_id],[K.session,d.session_id],[K.launched,d.launched_at],[K.cwd,d.launch.cwd]].filter(r=>r[1]);
  let h=`<div class=panel><div class=kv>${rows.map(([k,v])=>`<b>${esc(k)}</b><code>${esc(v)}</code>`).join("")}</div></div>`;
  if(d.launch.argv.length)h+=`<pre class=code style="margin:0 0 12px">${esc(d.launch.argv.map(shq).join(" "))}</pre>`;
  h+=`<div class=hint>${t.prompt}</div><div class=task>${esc(d.prompt||t.none)}</div>`;
  if(d.instructions.length)h+=`<div class=hint style="margin-top:14px">${t.instr}</div>`+d.instructions.map(x=>
    `<details class=checks><summary>${esc(x.title)}<span class=sub>${x.text.length.toLocaleString()} chars</span></summary><pre class=code>${esc(x.text)}</pre></details>`).join("");
  return `<div class=sec><h2>${t.launch}</h2>${h}</div>`;
}

function review(d,t){
  const rv=d.review;if(!rv||!rv.rounds.length)return "";
  return `<div class=sec><h2>${t.review}</h2><div class=rounds>${rv.rounds.map(r=>`<div class=round>
    <div class=rt><span>${t.round.replace("%N",r.round)}</span><span class="dec ${esc(r.decision)}">${esc(r.decision)}</span></div>
    <div class=sub>${r.interactions??"–"} ${t.inter} · ${r.observations??"–"} ${t.obs}</div>
    ${list(t.flows,r.checked_flows)}${list(t.findings,r.findings)}${r.evidence?img(r.evidence,r.evidence_src):""}</div>`).join("")}</div></div>`;
}
function deliv(d,t){
  const rs=(d.review&&d.review.rounds)||[],last=[...rs].reverse().find(r=>r.evidence);let h="";
  if(last)h+=`<div class=deliv style="margin-bottom:12px"><figure>${img(last.evidence,last.evidence_src)}<figcaption>${t.evidence} · ${esc(last.evidence_src)}</figcaption></figure></div>`;
  if(d.build)h+=`<div class=panel><div class=kv><b>${t.build}</b><code>${esc(d.build.argv.join(" "))} → exit ${esc(d.build.exit)}</code><b>at</b><code>${esc(d.build.at)}</code></div>
    ${d.build.log?`<pre class=code style="margin:10px 0 0">${esc(d.build.log)}</pre>`:""}</div>`;
  if(d.files.length)h+=`<div class=hint>${t.files}</div>`+d.files.map(f=>`<details class=checks><summary><span class=mono>${esc(f.path)}</span><span class=sub>${fmtSize(f.size)}${f.sha256?" · sha256 "+esc(f.sha256.slice(0,12)):""}</span></summary>
    ${f.text!=null?`<pre class=code>${esc(f.text)}</pre>`:`<div class=hint style="padding:0 12px 10px">${t.nofile}</div>`}</details>`).join("");
  return h?`<div class=sec><h2>${t.deliv}</h2>${h}</div>`:"";
}

const FILTERS=["all","explore","build","review","note"];
function mergedSteps(){
  const out=[];
  DATA.steps.forEach(s=>{const p=out[out.length-1];
    if(s.kind==="note"&&p&&p.kind==="note"&&p.stage===s.stage)p.text+="\n\n"+s.text;else out.push(Object.assign({},s))});
  return out;
}
function visible(s){return FILTER==="all"||(FILTER==="note"?(s.kind==="note"||s.kind==="final"):s.kind===FILTER)}
function stepHtml(s,t){
  const time=s.t?`<span class=time>${esc(s.t)}</span>`:"";
  if(s.kind==="note"||s.kind==="final")return `<div class=step><div class=num>${s.kind==="final"?"🏁":"💭"}</div><div>${time}<div class=think>${esc(s.text)}</div></div></div>`;
  const code=s.code&&s.code.trim()!==s.action?`<details class=raw><summary>${t.code}</summary><pre class=code>${esc(s.code)}</pre></details>`:"";
  const shots=s.shots.length?`<div class=shots>${s.shots.map(f=>img(f)).join("")}</div>`:"";
  const out=s.output?`<div class=out>${esc(s.output)}</div>`:"";
  return `<div class=step><div class=num>${s.i}</div><div><span class="tag ${esc(s.kind)}">${esc(s.kind)}</span>${time}<div class=act>${esc(s.action)}</div>${code}${shots}${out}</div></div>`;
}
function timeline(){
  const t=I18N[LANG],steps=mergedSteps(),stages=[];
  steps.forEach(s=>{if(!stages.includes(s.stage))stages.push(s.stage)});
  let h=`<div class=bar>${FILTERS.map(f=>`<span class="chip${f===FILTER?" on":""}" data-f=${f}>${f==="all"?t.all:t["f_"+f]}</span>`).join("")}</div>
    <div class=bar>${stages.map(s=>`<a class=jump href="#st-${esc(s)}">${esc(stageLabel(s))}</a>`).join("")}</div>
    <p class=hint>${t.reasoning.replace("%N",DATA.stats.reasoning_items)}</p>`;
  let cur=null;
  steps.forEach(s=>{
    if(s.stage!==cur){cur=s.stage;h+=`<div class=stagehdr id="st-${esc(s.stage)}">${esc(stageLabel(s.stage))}</div>`}
    if(visible(s))h+=stepHtml(s,t);
  });
  return h;
}
function paintTL(){
  const el=document.getElementById("tl");el.innerHTML=timeline();
  el.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{FILTER=c.dataset.f;paintTL()});
}
function paint(){
  const t=I18N[LANG],d=DATA;document.documentElement.lang=LANG;document.title=d.name+" · BlackBoxBench";
  document.querySelectorAll(".langtog button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));
  document.getElementById("app").innerHTML=header(d,t)+launch(d,t)+review(d,t)+deliv(d,t)
    +`<div class=sec><h2>${t.timeline}</h2><div id=tl></div></div><div class=sec style="text-align:center;color:var(--mut);font-size:12px;padding:30px 0">${t.foot}</div>`;
  paintTL();
}
document.querySelectorAll(".langtog button").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem("bbb_lang",LANG)}catch(e){}paint()});
paint();
</script></body></html>
