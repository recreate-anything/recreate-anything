<!doctype html><html lang=zh><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>BlackBoxBench · Trajectory Gallery</title>
<style>
:root{--bg:#f7f8fa;--card:#ffffff;--fg:#1a2233;--mut:#6b7280;--acc:#2b4c7e;--acc2:#3a6ea5;--ok:#1f8f4e;--bad:#c0392b;--line:#e4e7ec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.6 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:36px 24px 60px}
.hero{text-align:center;padding:12px 0 26px;border-bottom:1px solid var(--line);margin-bottom:26px}
.hero h1{font-size:30px;margin:0 0 8px;letter-spacing:-.02em;color:#141b2d}
.hero p{color:var(--mut);font-size:15px;margin:6px auto;max-width:720px}
.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 22px;min-width:120px;box-shadow:0 1px 3px rgba(20,30,60,.04)}
.stat .v{font-size:26px;font-weight:700;color:var(--acc);letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 22px}
.chip{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:#4b5563;cursor:pointer;font-size:13px;user-select:none;transition:.12s}
.chip:hover{border-color:var(--acc2);color:var(--acc)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.spacer{flex:1}
select,input{font:inherit;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 3px rgba(20,30,60,.04);transition:.14s}
.tcard:hover{border-color:var(--acc2);box-shadow:0 4px 14px rgba(20,30,60,.09);transform:translateY(-2px)}
.tcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tcard .nm{font-weight:600;font-size:15px;color:#141b2d;line-height:1.35;word-break:break-word}
.tcard .id{font-size:12px;color:var(--mut)}
.tcard .sc{font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;color:var(--acc)}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
.pill{padding:2px 8px;border-radius:6px;background:#eef1f5;border:1px solid var(--line)}
.pill.cat{background:#e5eefb;color:#2b5aa5;border-color:#d3e2f7;font-weight:600}
.pill.harness{background:#efe9f7;color:#6b4c9a;border-color:#ddd0ee;font-weight:600}
.pill.ok{background:#e6f4ea;color:#1f7a44;border-color:#c9e7d3;font-weight:600}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:40px 0 0}
.langtog{position:fixed;top:16px;right:18px;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);box-shadow:0 1px 3px rgba(20,30,60,.06);z-index:10}
.langtog button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;color:var(--mut)}
.langtog button.on{background:var(--acc);color:#fff}
</style></head><body>
<div class=langtog><button data-l=zh>中文</button><button data-l=en>EN</button></div>
<div class=wrap>
<div class=hero>
  <h1>BlackBoxBench · Trajectory Gallery</h1>
  <p id=subtitle></p>
  <div class=stats id=stats></div>
</div>
<div class=bar id=cats></div>
<div class=bar>
  <input id=q style="min-width:240px">
  <span class=spacer></span>
  <select id=sort><option value=score_desc></option><option value=score_asc></option><option value=cat></option><option value=steps_desc></option></select>
</div>
<div class=grid id=grid></div>
<div class=foot id=foot></div>
</div>
<script>
const ROWS=[{"id": "data11", "name": "ubuntu_diff_tool", "platform": "ubuntu", "agent": "codex", "model": "gpt-6.1-sol", "effort": "xhigh", "condition": "desktop-nograph", "score": 0.868, "steps": 255, "review_rounds": 6, "accepted": true, "duration_s": 3352}];
const I18N={
  zh:{subtitle:"%N 条桌面黑盒探索 → 复现 → 评审轨迹。每张卡片对应一次 agent 运行（commentary · 工具调用 · 截图 · 复现源码 · 评审轮次 · 评测得分）。",
      tasks:"样本数",mean:"平均分",acc:"已验收",rounds:"平均评审轮数",
      search:"搜索应用名 / ID / 模型…",sort_sd:"得分 ↓",sort_sa:"得分 ↑",sort_cat:"按平台",sort_st:"步数 ↓",
      steps:"步",rnds:"轮评审",accepted:"✓ 已验收",nores:"无匹配样本",
      foot:"BlackBoxBench 轨迹可视化 · 页面样式参考 WeaveBench Trajectory Gallery"},
  en:{subtitle:"%N desktop black-box explore → reproduce → review trajectories. Each card is one agent run (commentary · tool calls · screenshots · reproduction source · review rounds · evaluation score).",
      tasks:"samples",mean:"mean score",acc:"accepted",rounds:"avg review rounds",
      search:"Search app / ID / model…",sort_sd:"Score ↓",sort_sa:"Score ↑",sort_cat:"By platform",sort_st:"Steps ↓",
      steps:"steps",rnds:"review rounds",accepted:"✓ accepted",nores:"No matching samples",
      foot:"BlackBoxBench trajectory viewer · layout modeled on the WeaveBench Trajectory Gallery"}
};
let CAT="ALL",Q="",SORT="score_desc",LANG="zh";
try{LANG=localStorage.getItem("bbb_lang")||"zh"}catch(e){}
const CATS=["ALL",...[...new Set(ROWS.map(r=>r.platform).filter(Boolean))].sort()];
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function st(v,l){return `<div class=stat><div class=v>${v}</div><div class=l>${l}</div></div>`}
function pct(x){return typeof x==="number"?(x*100).toFixed(1)+"%":"N/A"}
function applyLang(){
  const t=I18N[LANG];document.documentElement.lang=LANG;
  document.getElementById("subtitle").textContent=t.subtitle.replace("%N",ROWS.length);
  document.getElementById("q").placeholder=t.search;
  document.getElementById("foot").textContent=t.foot;
  const so=document.getElementById("sort").options;
  so[0].textContent=t.sort_sd;so[1].textContent=t.sort_sa;so[2].textContent=t.sort_cat;so[3].textContent=t.sort_st;
  document.querySelectorAll(".langtog button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));
  renderStats();render();
}
function renderStats(){
  const t=I18N[LANG],sc=ROWS.filter(r=>typeof r.score==="number").map(r=>r.score);
  const mean=sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:null;
  const rr=ROWS.length?ROWS.reduce((a,r)=>a+(r.review_rounds||0),0)/ROWS.length:0;
  document.getElementById("stats").innerHTML=st(ROWS.length,t.tasks)+st(pct(mean),t.mean)
    +st(ROWS.filter(r=>r.accepted).length+" / "+ROWS.length,t.acc)+st(rr.toFixed(1),t.rounds);
}
function render(){
  const t=I18N[LANG];
  const r=ROWS.filter(x=>(CAT==="ALL"||x.platform===CAT)&&(!Q||[x.name,x.id,x.model,x.agent].join(" ").toLowerCase().includes(Q)));
  const cmp={score_desc:(a,b)=>(b.score??-1)-(a.score??-1),score_asc:(a,b)=>(a.score??2)-(b.score??2),
    cat:(a,b)=>(a.platform||"").localeCompare(b.platform||"")||(b.score??-1)-(a.score??-1),steps_desc:(a,b)=>b.steps-a.steps};
  r.sort(cmp[SORT]);
  document.getElementById("grid").innerHTML=r.map(x=>`<a class=tcard href="tasks/${encodeURIComponent(x.id)}.html">
      <div class=top><div><div class=nm>${esc(x.name)}</div><div class=id>${esc(x.id)}</div></div><div class=sc>${pct(x.score)}</div></div>
      <div class=meta>${x.platform?`<span class="pill cat">${esc(x.platform)}</span>`:""}<span class=pill>${esc(x.model)}${x.effort?" · "+esc(x.effort):""}</span>
        <span class="pill harness">${esc(x.agent)}</span>${x.condition?`<span class=pill>${esc(x.condition)}</span>`:""}
        <span class=pill>${x.steps} ${t.steps}</span>${x.review_rounds?`<span class=pill>${x.review_rounds} ${t.rnds}</span>`:""}
        ${x.accepted?`<span class="pill ok">${t.accepted}</span>`:""}</div>
    </a>`).join("")||`<p style='color:var(--mut)'>${t.nores}</p>`;
}
document.getElementById("cats").innerHTML=CATS.map(c=>`<span class="chip${c==="ALL"?" on":""}" data-c="${esc(c)}">${esc(c)}</span>`).join("");
document.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{CAT=el.dataset.c;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===el));render()});
document.getElementById("q").oninput=e=>{Q=e.target.value.toLowerCase();render()};
document.getElementById("sort").onchange=e=>{SORT=e.target.value;render()};
document.querySelectorAll(".langtog button").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem("bbb_lang",LANG)}catch(e){}applyLang()});
applyLang();
</script></body></html>
